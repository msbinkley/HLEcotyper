default :
  Input :
    Discovery dataset name : "cHL_discovery"
    # Bulk tumor TPM: genes x samples, protein-coding, columns sum to 1e6 (same file as 01_cibersortx/04_hires_bulk_tumor.sh)
    Expression matrix : "/path/to/bulk_input/cHL_bulk_TPM.txt"
    # 13 pooled cell-type fractions per sample (01_cibersortx/resources/pool_fractions_16_to_13.R output)
    Cell type fractions : "/path/to/datasets/cHL_Fractions_Norm.txt"
    Expression type : "RNA-seq"
    # sample annotation used only for heat-map tracks (ID column + any of the columns below)
    Annotation file : "/path/to/datasets/cHL_metadata.txt"
    Annotation file column to scale by : "NULL"
    Annotation file column(s) to plot : [ "EBV", "Age_Bin", "Cohort", "Gender", "Subtype_Code"]
    CIBERSORTx username : "<CIBERSORTX_USER>"
    CIBERSORTx token : "<CIBERSORTX_TOKEN>"

  Output :
    Output folder : "cHL_output_90_6_6"

  Pipeline settings :
    # step 1 fractions | 2 HiRes purification | 3 state discovery (NMF) | 4 choose #states
    # 5 extract state info | 6 state QC | 7 advanced QC | 8 ecotype discovery
    # [7] = full run from the TPM. The published model re-used the HiRes output of
    # 01_cibersortx/04_hires_bulk_tumor.sh and ran steps 4-8 with [1,2,3,7] (see README).
    Pipeline steps to skip : [7]
    Number of threads : 50
    Number of NMF restarts : 50
    Maximum number of states per cell type : 6
    Cophenetic coefficient cutoff : 0.90
    CIBERSORTx fractions Singularity path : "/path/to/Cibersort/fractions.sif"
    CIBERSORTx hires Singularity path : "/path/to/Cibersort/hires.sif"
    Minimum number of states in ecotypes : 6
